name: Bitcoin Node Monitor (experimental)
version: "0.1.0-alpha.2"
slug: bitcoin-node-monitor
description: Restricted Bitcoin Core monitoring via MQTT
url: https://github.com/ChristophKomenda/bitcoin-node-monitor
arch: [aarch64, amd64]
startup: application
boot: manual
init: false
stage: experimental
options:
  node_id: bitcoin
  rpc_url: "https://bitcoin.example.invalid:8332"
  rpc_username: ""
  rpc_password: ""
  allow_insecure_rpc: false
  mqtt_host: core-mosquitto
  mqtt_port: 8883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls: true
  allow_insecure_mqtt: false
  discovery_prefix: homeassistant
  poll_interval: 60
  stall_minutes: 30
schema:
  node_id: str
  rpc_url: str
  rpc_username: str
  rpc_password: password
  allow_insecure_rpc: bool
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_tls: bool
  allow_insecure_mqtt: bool
  discovery_prefix: str
  poll_interval: int(15,3600)
  stall_minutes: int(1,1440)
