name: Pironman IR Receiver
version: "0.2.2"
slug: pironman-ir-receiver
description: Receive IR signals from the Pironman 5 Max for Home Assistant and HAIR
url: https://github.com/ChristophKomenda/home-assistant-addon
arch:
  - aarch64
startup: application
boot: auto
init: false
homeassistant: "2026.6.0"
homeassistant_api: true
devices:
  - /dev/lirc0
options:
  receiver_id: pironman5-max
  event_mode: standalone
  debug: false
schema:
  receiver_id: str
  event_mode: list(standalone|pironman5)
  debug: bool
