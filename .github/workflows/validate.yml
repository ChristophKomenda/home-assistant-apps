name: Validate app distribution
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m pip install --break-system-packages PyYAML==6.0.2
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/sync_upstream.py --check
